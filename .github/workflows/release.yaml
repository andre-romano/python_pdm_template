name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build executavel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.14']

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar PDM
        run: python -m pip install --upgrade pip pdm

      - name: Instalar dependencias
        run: pdm install --no-self

      - name: Instalar PyInstaller
        run: pdm run pip install "pyinstaller>=6.10" setuptools

      # ----- CLI -----
      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: pdm run pyinstaller --onefile --name log-sentinel src/python_pdm_template/__main__.py

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        run: pdm run pyinstaller --onefile --name log-sentinel.exe src/python_pdm_template/__main__.py

      # ----- GUI (windowed, sem console) -----
      - name: Build GUI (Linux)
        if: runner.os == 'Linux'
        run: pdm run pyinstaller --onefile --windowed --name log-sentinel-gui --collect-all PySide6 src/python_pdm_template/gui/main.py

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: pdm run pyinstaller --onefile --windowed --name log-sentinel-gui.exe --collect-all PySide6 src/python_pdm_template/gui/main.py

      # ----- Smoke test do binario da CLI -----
      # Usa sample.log (sem deteccao, exit 0) porque a CLI retorna 1 quando
      # encontra qualquer anomalia - semantica estilo grep.
      - name: Smoke test CLI (Linux)
        if: runner.os == 'Linux'
        run: ./dist/log-sentinel analyze tests/fixtures/sample.log

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        run: .\dist\log-sentinel.exe analyze tests\fixtures\sample.log
        shell: cmd

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: log-sentinel-${{ matrix.os }}
          path: |
            dist/log-sentinel*
          retention-days: 30

  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
