# .github/workflows/test.yaml
# Workflow para rodar testes automatizados com pytest
name: Testes com Pytest

# Dispara o workflow em push ou execução manual
on: [push, workflow_dispatch]

jobs:
  test:
    # Nome do job exibido na interface do GitHub Actions
    name: Test on ${{ matrix.os }} with Python
    # Define o sistema operacional para rodar o job (matriz)
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Testa em múltiplos sistemas operacionais
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Testa com a versão mais recente do Python 3
        python-version:
          - "3.x"

    steps:
      # Faz o checkout do código-fonte do repositório
      # fetch-depth: 0 é exigido pelo SonarCloud para análise de blame
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instala a versão do Python definida na matriz
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache das dependências do PDM para acelerar execuções futuras
      - name: Cache PDM dependencies for Python ${{ matrix.python-version }}
        uses: actions/cache@v4
        with:
          path: |
            __pypackages__/
            .venv/
          key: ${{ runner.os }}-pdm-python-${{ matrix.python-version }}-${{ hashFiles('**/pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pdm-python-${{ matrix.python-version }}-

      # Instala libs de sistema exigidas pelo Qt em runners headless (Linux)
      - name: Instalar libs Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
        shell: bash

      # Instala o PDM, dependências do projeto e checa integridade dos pacotes
      - name: Install Python ${{ matrix.python-version }} dependencies for ${{ matrix.os }}
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install
          pdm run pip check
        shell: bash

      # Executa os testes automatizados com pytest, forcando plataforma
      # Qt "offscreen" em CI para nao depender de display grafico
      - name: Testing app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pdm run pytest
        shell: bash

      # Análise de qualidade com SonarCloud (opcional - roda só se SONAR_TOKEN estiver configurado)
      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
